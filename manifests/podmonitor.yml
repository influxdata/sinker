---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  labels:
    app.kubernetes.io/name: sinker
  name: sinker
  namespace: sinker
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: sinker
  podMetricsEndpoints:
    - port: admin
      path: /metrics
      relabelings:
        # PodMonitor discovery has no Service; supply the dashboard's service label.
        # namespace and pod come from discovery; k8s_cluster must be supplied by the
        # monitoring setup (see ../README.md, Status and observability).
        - targetLabel: service
          replacement: sinker
