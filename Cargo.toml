[package]
name = "sinker"
version = "0.1.0"
license = "MIT"
edition = "2021"
keywords = ["kubernetes"]
repository = "https://github.com/influxdata/sinker"
authors = ["InfluxData"]
description = "Copy k8s resources (or parts thereof) across clusters"

[dependencies]
clap = { version = "^4.5.60", features = ["derive", "help", "env", "std"] }
futures = "^0.3.32"
kube = { version = "^4.2.0", features = ["runtime", "derive", "unstable-runtime"] }
k8s-openapi = { version = "^0.28.0", features = ["v1_36", "schemars"] }
# Kubert 0.25 still uses kube 1.1; select matching bindings for its HTTP transport.
k8s-openapi-legacy = { package = "k8s-openapi", version = "^0.25.0", features = ["v1_33"] }
http = "1.4.0"
tower = { version = "0.5.2", features = ["util"] }
kubert = { version = "^0.25.0", features = [
    "clap",
    "runtime",
    "server",
    "rustls-tls",
    "prometheus-client",
] }
tokio = { version = "^1.49.0", features = ["full"] }
anyhow = { version = "^1.0.102", features = ["backtrace"] }
tracing = "^0.1.44"
schemars = "^1.2.2"
serde = { version = "^1.0.228", features = ["derive"] }
serde_json = "^1.0.150"
serde_yaml = "^0.9.34"
thiserror = "^2.0.18"
serde_json_path = "^0.7.2"
tokio-context = "^0.1.3"
tokio-stream = "^0.1.18"
regex = "^1.12.3"

[dev-dependencies]
http-body = "1.0.1"
http-body-util = "0.1.3"
rstest = "^0.26.1"
once_cell = "^1.21.3"
rand = "^0.10.2"
